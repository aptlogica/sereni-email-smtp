name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23'
           
      - name: Install dependencies
        run: go mod tidy
        
      - name: Run go vet
        run: go vet ./...
        
      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic -coverpkg='./...' ./tests/...
        
      - name: Upload coverage reports
        uses: codecov/codecov-action@eaaf4bedf32dbdc6b720b63067d99c4d77d6047d # v3.1.4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false
          
      - name: Build binary
        run: go build -o bin/sereni-email-smtp ./cmd/server
        
      - name: Docker build test
        run: docker build -t sereni-email-smtp:test .
        

